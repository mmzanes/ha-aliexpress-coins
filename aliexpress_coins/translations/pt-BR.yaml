configuration:
  locale:
    name: Idioma do navegador
    description: >-
      Idioma e localidade do Chromium que faz o login e o check-in, ex. en-US ou pt-BR.
      Reinicie o add-on depois de mudar.
  extra_tasks:
    name: Tarefas extras de moedas
    description: >-
      Depois do check-in, faz também as tarefas de moedas que só pedem para abrir ou navegar
      numa página (cerca de 30 moedas a mais por dia). Tarefas com anúncios, jogos ou pedidos
      nunca são feitas. Cada execução leva 10-20 minutos a mais.
